<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #cbd5e1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    @keyframes pulse-node {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .node { animation: pulse-node 3s infinite ease-in-out; }
    .node-delay-1 { animation-delay: 1s; }
    .node-delay-2 { animation-delay: 2s; }
    
    .connecting-line {
      stroke: #6366f1;
      stroke-width: 1.5;
      stroke-dasharray: 6, 6;
      opacity: 0.4;
      animation: dash 4s linear infinite;
    }

    .pill-card { animation: float 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Network Lines & Pulsing Nodes -->
  <g class="network-layer">
    <line x1="150" y1="80" x2="350" y2="280" class="connecting-line"/>
    <line x1="350" y1="280" x2="600" y2="300" class="connecting-line"/>
    <line x1="600" y1="300" x2="900" y2="250" class="connecting-line"/>
    <line x1="900" y1="250" x2="1050" y2="90" class="connecting-line"/>
    <line x1="1050" y1="90" x2="750" y2="70" class="connecting-line"/>
    <line x1="750" y1="70" x2="150" y2="80" class="connecting-line"/>

    <circle cx="150" cy="80" r="6" fill="#818cf8" class="node"/>
    <circle cx="350" cy="280" r="8" fill="#c084fc" class="node node-delay-1"/>
    <circle cx="600" cy="300" r="5" fill="#f472b6" class="node node-delay-2"/>
    <circle cx="900" cy="250" r="9" fill="#38bdf8" class="node"/>
    <circle cx="1050" cy="90" r="7" fill="#4ade80" class="node node-delay-1"/>
    <circle cx="750" cy="70" r="6" fill="#facc15" class="node node-delay-2"/>
  </g>

  <!-- Decorative Glowing Backdrop -->
  <circle cx="600" cy="180" r="180" fill="#4f46e5" opacity="0.15" filter="url(#glow)"/>

  <!-- Foreground Glass Box -->
  <rect x="80" y="45" width="1040" height="270" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" opacity="0.95"/>

  <!-- Header Accent Line -->
  <rect x="130" y="85" width="120" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Title and Subtitle -->
  <text x="130" y="145" class="title">Awesome Distributed Order Management</text>
  <text x="130" y="185" class="subtitle">Omnichannel Fulfillment, Real-Time Inventory Sourcing &amp; Order Orchestration Ecosystem</text>

  <!-- Feature Pills -->
  <g transform="translate(130, 225)">
    <!-- Pill 1 -->
    <g class="pill-card">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#334155" stroke="#818cf8" stroke-width="1"/>
      <text x="85" y="24" text-anchor="middle" class="badge-text">Order Routing</text>
    </g>
    
    <!-- Pill 2 -->
    <g class="pill-card" transform="translate(185, 0)">
      <rect x="0" y="0" width="195" height="38" rx="19" fill="#334155" stroke="#c084fc" stroke-width="1"/>
      <text x="97" y="24" text-anchor="middle" class="badge-text">Inventory Sourcing</text>
    </g>

    <!-- Pill 3 -->
    <g class="pill-card" transform="translate(395, 0)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="#334155" stroke="#f472b6" stroke-width="1"/>
      <text x="95" y="24" text-anchor="middle" class="badge-text">Omnichannel Retail</text>
    </g>

    <!-- Pill 4 -->
    <g class="pill-card" transform="translate(598, 0)">
      <rect x="0" y="0" width="175" height="38" rx="19" fill="#334155" stroke="#38bdf8" stroke-width="1"/>
      <text x="87" y="24" text-anchor="middle" class="badge-text">Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>
